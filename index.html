<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jeton - One app for all needs</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <div class="logo">Jeton</div>
    <nav>
      <div class="language">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <circle cx="10" cy="10" r="8" stroke="currentColor" stroke-width="1.5"/>
          <path d="M2 10h16M10 2c-2.5 3-2.5 13 0 16M10 2c2.5 3 2.5 13 0 16" stroke="currentColor" stroke-width="1.5"/>
        </svg>
        <span>EN</span>
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
          <path d="M3 5l3 3 3-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </div>
      <a href="#" class="login">Log in</a>
      <a href="#" class="signup">Sign up</a>
    </nav>
  </header>

  <main>
    <div class="content-left">
      <h1>
        One app<br>
        for all needs
      </h1>
      <div class="scroll-indicator">
        <span>Scroll</span>
      </div>
    </div>

    <div class="sphere-container">
      <div class="sphere">
        <div class="slice slice-1"></div>
        <div class="slice slice-2"></div>
        <div class="slice slice-3"></div>
        <div class="slice slice-4"></div>
        <div class="slice slice-5"></div>
      </div>
    </div>

    <div class="content-right">
      <p class="tagline">Single account for all your<br>payments.</p>
      <div class="app-buttons">
        <a href="#" class="app-store">
          <svg width="20" height="24" viewBox="0 0 20 24" fill="currentColor">
            <path d="M16.3 13c0-2.8 2.3-4.2 2.4-4.3-1.3-1.9-3.3-2.2-4-2.2-1.7-.2-3.3 1-4.2 1-.9 0-2.3-1-3.8-1-2 0-3.8 1.1-4.8 2.9C-.4 12.8 1 18.5 3.2 21.7c1.1 1.6 2.4 3.3 4.1 3.2 1.6-.1 2.2-1 4.1-1s2.4 1 4.1 1c1.7 0 2.9-1.5 4-3.1 1.3-1.8 1.8-3.6 1.8-3.7 0 0-3.6-1.4-3.6-5.1zM13.2 4.3c.9-1.1 1.5-2.6 1.3-4.1-1.3.1-2.8.9-3.7 1.9-.8.9-1.5 2.4-1.3 3.8 1.4.1 2.8-.7 3.7-1.6z"/>
          </svg>
          <div>
            <span class="small">Download on the</span>
            <span class="large">App Store</span>
          </div>
        </a>
        <a href="#" class="play-store">
          <svg width="20" height="22" viewBox="0 0 20 22" fill="currentColor">
            <path d="M.5 1.3C.5.8.7.4 1.1.2L11.6 10.7.5 21.2V1.3zm12.2 10.5l2.4 2.4-10.9 6.3 8.5-8.7zm0-1.4L4.2 2 15.1.5l-2.4 2.4 5.5 5.5-5.5 5.5zm6.8-5.9l-3.1 1.8-2.2-2.2 2.2-2.2 3.1 1.8c.8.5.8 1.5 0 2z"/>
          </svg>
          <div>
            <span class="small">GET IT ON</span>
            <span class="large">Google Play</span>
          </div>
        </a>
      </div>
    </div>
  </main>

  <footer>
    <nav class="bottom-nav">
      <a href="#" class="nav-item active">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
          <path d="M3 9l7-6 7 6v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/>
        </svg>
      </a>
      <a href="#" class="nav-item">
        Personal
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
          <path d="M3 5l3 3 3-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </a>
      <a href="#" class="nav-item">
        Business
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
          <path d="M5 3l3 3-3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </a>
      <a href="#" class="nav-item">
        Company
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
          <path d="M3 5l3 3 3-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </a>
    </nav>
    <button class="support">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
        <path d="M10 2a6 6 0 016 6v2.5a2.5 2.5 0 005 0V8a8 8 0 10-8 8h3v-2h-3a6 6 0 01-6-6V8a6 6 0 016-6z"/>
      </svg>
      Support
    </button>
  </footer>
</body>
</html>
